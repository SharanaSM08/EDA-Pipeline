<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Login Page</h1>

    <form method="POST">

        <input type="email"
               name="email"
               placeholder="Enter Email"
               required>

        <br><br>

        <input type="text"
               name="otp"
               placeholder="Enter OTP"
               required>

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <h3>{{ message }}</h3>

</div>

</body>
</html>
